<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bored Buster - Brain Games</title>
<style>
:root{--bg:#EAF4FF;--ink:#14213D;--card:#fff;--sun:#FCA311;--pink:#FF5D8F;--teal:#1AA6A0;--line:#c9d9ee}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Trebuchet MS','Segoe UI',sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:2rem;margin:.2em 0}h2{margin:.3em 0}
a{color:var(--ink)}
.screen{display:none}.screen.on{display:block}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
button{font:inherit;cursor:pointer;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 16px;font-weight:700}
button:hover{background:#fff3d6}
button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.big{flex:1 1 180px;text-align:left;padding:18px}
.big small{display:block;font-weight:400}
.primary{background:var(--sun)}
.bar{display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px}
.meter{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:16px}
.meter i{display:block;height:100%;width:100%;background:var(--teal);transition:width .25s linear}
.q{font-size:1.3rem;font-weight:700;margin:8px 0 16px}
.opts{display:grid;gap:10px}
.opts button{text-align:left}
.opts .ok{background:#bff0d4;border-color:#0a7a45}
.opts .bad{background:#ffd0dc;border-color:#c2305a}
.grid{display:grid;gap:8px}
.card{aspect-ratio:1;font-size:1.8rem;display:flex;align-items:center;justify-content:center;padding:0;background:var(--ink);color:var(--ink)}
.card.up{background:#fff;color:inherit}
.card.done{background:#bff0d4;border-color:#0a7a45}
.result{background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:22px;text-align:center}
.score{font-size:2.6rem;font-weight:800;color:var(--pink);margin:0}
@media (prefers-reduced-motion:reduce){.meter i{transition:none}}
</style>
</head>
<body>
<main>
<p><a href="index.html">&larr; Back to Bored Buster</a></p>
<h1>Brain Games</h1>

<section id="home" class="screen on">
  <p>Pick a game, then choose how tough you want it.</p>
  <div class="row">
    <button class="big" data-game="trivia">Trivia<small>Questions change every round</small></button>
    <button class="big" data-game="memory">Memory Match<small>Find all the pairs</small></button>
  </div>
</section>

<section id="levels" class="screen">
  <h2 id="levelTitle"></h2>
  <p>Choose a level.</p>
  <div class="row">
    <button class="big" data-level="easy">Easy</button>
    <button class="big" data-level="medium">Medium</button>
    <button class="big" data-level="hard">Difficult</button>
  </div>
  <button id="levelsBack">Back</button>
</section>

<section id="triviaPlay" class="screen">
  <div class="bar"><span id="tProg"></span><span id="tScore"></span><span id="tTime"></span></div>
  <div class="meter"><i id="tMeter"></i></div>
  <p class="q" id="tQ"></p>
  <div class="opts" id="tOpts"></div>
</section>

<section id="memoryPlay" class="screen">
  <div class="bar"><span id="mMoves"></span><span id="mPairs"></span></div>
  <div class="grid" id="mGrid"></div>
</section>

<section id="result" class="screen">
  <div class="result">
    <h2 id="rTitle"></h2>
    <p class="score" id="rScore"></p>
    <p id="rMsg"></p>
    <div class="row" style="justify-content:center">
      <button class="primary" id="againBtn">Play again</button>
      <button id="levelBtn">Change level</button>
      <button id="homeBtn">All games</button>
    </div>
  </div>
</section>
</main>

<script>
// Each question: [question, correct answer, wrong1, wrong2, wrong3]. Answers are shuffled every time.
const BANK = {
easy:[
["Which planet is closest to the Sun?","Mercury","Venus","Earth","Mars"],
["How many continents are there?","7","5","6","8"],
["What is the capital of France?","Paris","Lyon","Rome","Madrid"],
["Which animal is called the king of the jungle?","Lion","Tiger","Elephant","Bear"],
["Mixing blue and yellow makes which color?","Green","Purple","Orange","Brown"],
["How many days are in a leap year?","366","365","364","367"],
["Which is the largest ocean?","Pacific","Atlantic","Indian","Arctic"],
["Which gas do plants take in from the air?","Carbon dioxide","Oxygen","Nitrogen","Helium"],
["What is the capital of the Philippines?","Manila","Cebu","Davao","Quezon City"],
["Which fruit is said to keep the doctor away?","Apple","Banana","Mango","Grape"],
["How many sides does a hexagon have?","6","5","7","8"],
["Which is the largest mammal?","Blue whale","Elephant","Giraffe","Great white shark"],
["What do bees make?","Honey","Silk","Milk","Paper"],
["What is the chemical formula of water?","H2O","CO2","NaCl","O2"],
["Which country is directly north of Singapore?","Malaysia","Indonesia","Thailand","Vietnam"],
["How many minutes are in an hour?","60","100","30","90"]],
medium:[
["Who painted the Mona Lisa?","Leonardo da Vinci","Michelangelo","Raphael","Picasso"],
["What is the chemical symbol for gold?","Au","Ag","Go","Gd"],
["Which river runs through Cairo?","Nile","Tigris","Danube","Ganges"],
["What is the hardest natural substance?","Diamond","Quartz","Steel","Granite"],
["In which year did humans first land on the Moon?","1969","1965","1972","1959"],
["What is the smallest country in the world?","Vatican City","Monaco","Malta","San Marino"],
["Who wrote Romeo and Juliet?","William Shakespeare","Charles Dickens","Jane Austen","Mark Twain"],
["Who wrote the novel Noli Me Tangere?","Jose Rizal","Francisco Balagtas","Emilio Aguinaldo","Apolinario Mabini"],
["Which vitamin does your skin make from sunlight?","Vitamin D","Vitamin A","Vitamin C","Vitamin B12"],
["What is the capital of Australia?","Canberra","Sydney","Melbourne","Perth"],
["Which planet is famous for its bright rings?","Saturn","Mars","Venus","Mercury"],
["Which language has the most native speakers?","Mandarin Chinese","English","Spanish","Hindi"],
["Which element has atomic number 1?","Hydrogen","Helium","Oxygen","Carbon"],
["In which year did Singapore become independent?","1965","1959","1963","1971"],
["How many bones does an adult human have?","206","186","212","256"],
["Which instrument has 88 keys?","Piano","Accordion","Harp","Violin"]],
hard:[
["What is the capital of Kazakhstan?","Astana","Almaty","Tashkent","Bishkek"],
["Who discovered penicillin?","Alexander Fleming","Louis Pasteur","Joseph Lister","Marie Curie"],
["What is the largest desert in the world?","Antarctic Desert","Sahara","Arabian Desert","Gobi"],
["Which element has the symbol W?","Tungsten","Tantalum","Thallium","Tellurium"],
["In which year did the Berlin Wall fall?","1989","1991","1987","1985"],
["Who wrote the novel 1984?","George Orwell","Aldous Huxley","Ray Bradbury","H.G. Wells"],
["Which is the smallest bone in the human body?","Stapes","Malleus","Incus","Hyoid"],
["Which country has the most time zones, counting overseas territories?","France","Russia","United States","China"],
["About how fast does light travel?","300,000 km per second","150,000 km per second","30,000 km per second","3,000,000 km per second"],
["Who composed The Four Seasons?","Antonio Vivaldi","Johann Sebastian Bach","Mozart","Handel"],
["Which gas makes up most of Earth's atmosphere?","Nitrogen","Oxygen","Argon","Carbon dioxide"],
["Which mountain is tallest when measured from its base on the sea floor?","Mauna Kea","Everest","K2","Kilimanjaro"],
["Which is the largest island in the Philippines?","Luzon","Mindanao","Samar","Palawan"],
["Who was the first woman to win a Nobel Prize?","Marie Curie","Mother Teresa","Rosalind Franklin","Ada Lovelace"],
["Which blood type is the universal red cell donor?","O negative","AB positive","A negative","B positive"],
["In which year did Magellan reach the Philippines?","1521","1492","1565","1498"]]
};
const TIME = {easy:25, medium:20, hard:12};
const ROUND = 8;
const seen = {easy:[], medium:[], hard:[]};   // remembers questions already used, so new rounds feel fresh
const EMOJI = ["🍎","🌻","🚀","🎧","🐱","🍰","⚽","🌈","🎲","🦋","🍕","🎸"];
const PAIRS = {easy:6, medium:8, hard:10};
const $ = id => document.getElementById(id);
let game = null, level = null, timer = null;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');window.scrollTo(0,0);}
function stopTimer(){clearInterval(timer);timer=null;}

// Navigation
document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>{game=b.dataset.game;$('levelTitle').textContent=game==='trivia'?'Trivia':'Memory Match';show('levels');});
document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=b.dataset.level;startGame();});
$('levelsBack').onclick=()=>show('home');
$('levelBtn').onclick=()=>{stopTimer();show('levels');};
$('homeBtn').onclick=()=>{stopTimer();show('home');};
$('againBtn').onclick=()=>startGame();   // Play again always resets everything

function startGame(){stopTimer();game==='trivia'?startTrivia():startMemory();}

/* ---------- TRIVIA ---------- */
let qs=[], qi=0, score=0, left=0, locked=false;
function startTrivia(){
  const pool=BANK[level].map((_,i)=>i);
  let fresh=pool.filter(i=>!seen[level].includes(i));
  let pick=shuffle(fresh).slice(0,ROUND);
  if(pick.length<ROUND){                       // bank nearly used up: start over, but keep new questions first
    seen[level]=[];
    pick=pick.concat(shuffle(pool.filter(i=>!pick.includes(i)))).slice(0,ROUND);
  }
  seen[level].push(...pick);
  qs=pick.map(i=>{const [q,right,...wrong]=BANK[level][i];return {q,right,opts:shuffle([right,...wrong])};});
  qi=0;score=0;show('triviaPlay');showQ();
}
function showQ(){
  const cur=qs[qi];locked=false;left=TIME[level];
  $('tProg').textContent='Question '+(qi+1)+' of '+ROUND;
  $('tScore').textContent='Score: '+score;
  $('tQ').textContent=cur.q;
  $('tOpts').innerHTML='';
  cur.opts.forEach(o=>{const b=document.createElement('button');b.textContent=o;b.onclick=()=>answer(b,o);$('tOpts').appendChild(b);});
  tick();stopTimer();timer=setInterval(()=>{left--;tick();if(left<=0)answer(null,null);},1000);
}
function tick(){$('tTime').textContent=left+'s';$('tMeter').style.width=(left/TIME[level]*100)+'%';}
function answer(btn,val){
  if(locked)return;locked=true;stopTimer();
  const cur=qs[qi];
  if(val===cur.right)score++;
  [...$('tOpts').children].forEach(b=>{b.disabled=true;if(b.textContent===cur.right)b.classList.add('ok');else if(b===btn)b.classList.add('bad');});
  $('tScore').textContent='Score: '+score;
  setTimeout(()=>{qi++;qi<ROUND?showQ():endTrivia();},1100);
}
function endTrivia(){
  const msg=score>=ROUND-1?'Brilliant! You really know your stuff.':score>=ROUND/2?'Nice work. Try again for a higher score!':'Good try. A new set of questions is waiting for you.';
  $('rTitle').textContent='Trivia finished';$('rScore').textContent=score+' / '+ROUND;$('rMsg').textContent=msg;show('result');
}

/* ---------- MEMORY MATCH ---------- */
let cards=[], flipped=[], moves=0, found=0, busy=false;
function startMemory(){
  const n=PAIRS[level];
  cards=shuffle(shuffle(EMOJI).slice(0,n).flatMap(e=>[e,e]));
  flipped=[];moves=0;found=0;busy=false;
  const cols=level==='easy'?3:4;
  const g=$('mGrid');g.style.gridTemplateColumns='repeat('+(level==='hard'?5:cols)+',1fr)';g.innerHTML='';
  cards.forEach((e,i)=>{const b=document.createElement('button');b.className='card';b.setAttribute('aria-label','Card '+(i+1));b.onclick=()=>flip(b,i);g.appendChild(b);});
  updMem();show('memoryPlay');
}
function updMem(){$('mMoves').textContent='Moves: '+moves;$('mPairs').textContent='Pairs: '+found+' / '+PAIRS[level];}
function flip(b,i){
  if(busy||b.classList.contains('up')||b.classList.contains('done'))return;
  b.classList.add('up');b.textContent=cards[i];flipped.push({b,i});
  if(flipped.length<2)return;
  moves++;busy=true;const [x,y]=flipped;
  if(cards[x.i]===cards[y.i]){x.b.classList.add('done');y.b.classList.add('done');found++;flipped=[];busy=false;updMem();
    if(found===PAIRS[level])setTimeout(()=>{$('rTitle').textContent='All pairs found!';$('rScore').textContent=moves+' moves';$('rMsg').textContent='Fewer moves means a sharper memory. Can you beat it?';show('result');},500);
  }else{updMem();setTimeout(()=>{[x,y].forEach(c=>{c.b.classList.remove('up');c.b.textContent='';});flipped=[];busy=false;},800);}
}
</script>
</body>
</html>
